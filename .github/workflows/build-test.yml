name: Build and Test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    - name: Build Go application
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main .

    - name: Run Go tests
      run: go test -v ./...

    - name: Run Chaos Tests
      run: go test -tags chaos -v ./test/chaos/...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Google Auth
      if: github.actor != 'dependabot[bot]'
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: github.actor != 'dependabot[bot]'
      uses: google-github-actions/setup-gcloud@v2

    - name: Get Project ID
      if: github.actor != 'dependabot[bot]'
      id: project
      run: echo "id=$(gcloud config get-value project)" >> $GITHUB_OUTPUT

    - name: Configure Docker to push to Artifact Registry
      if: github.actor != 'dependabot[bot]'
      run: gcloud auth configure-docker ${{ vars.GCR_HOSTNAME }}

    - name: Build Docker image
      env:
        IMAGE_NAME: todo-app-go
        IMAGE_TAG: ${{ github.sha }}
        GCR_HOSTNAME: ${{ vars.GCR_HOSTNAME || 'gcr.io' }}
        GAR_REPOSITORY: todo-app-go
        GCP_PROJECT: ${{ steps.project.outputs.id || 'placeholder' }}
      run: |
        docker build -t $GCR_HOSTNAME/$GCP_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG .

    - name: Push Docker image
      if: github.actor != 'dependabot[bot]'
      env:
        IMAGE_NAME: todo-app-go
        IMAGE_TAG: ${{ github.sha }}
        GCR_HOSTNAME: ${{ vars.GCR_HOSTNAME }}
        GAR_REPOSITORY: todo-app-go
        GCP_PROJECT: ${{ steps.project.outputs.id }}
      run: |
        docker push $GCR_HOSTNAME/$GCP_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.5.0

    - name: Sign image with a keyless signature
      if: github.actor != 'dependabot[bot]'
      env:
        IMAGE_NAME: todo-app-go
        IMAGE_TAG: ${{ github.sha }}
        GCR_HOSTNAME: ${{ vars.GCR_HOSTNAME }}
        GAR_REPOSITORY: todo-app-go
        GCP_PROJECT: ${{ steps.project.outputs.id }}
      run: |
        IMAGE_PATH="$GCR_HOSTNAME/$GCP_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG"
        echo "Signing image: $IMAGE_PATH"
        cosign sign --yes "$IMAGE_PATH"

  security_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -tests=false ./...

      - name: Install and run Trivy vulnerability scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --exit-code 1 --ignore-unfixed --vuln-type os,library --severity CRITICAL,HIGH --ignorefile .trivyignore --format table .

