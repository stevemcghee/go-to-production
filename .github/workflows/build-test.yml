name: Build and Test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'  # keep in sync with the Dockerfile builder (golang:1.27-alpine)

    - name: Build Go application
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o main .

    - name: Run Go tests
      run: go test -v ./...

    - name: Run Chaos Tests
      run: go test -tags chaos -v ./test/chaos/...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t todo-app-go:local .

    # The following steps require GCP credentials configured in the repository secrets.
    # See docs/DEPLOY_TO_GCP.md for setup instructions.
    - name: Check for GCP Credentials
      id: check-creds
      run: |
        if [ -n "${{ secrets.GCP_SA_KEY }}" ] || [ -n "${{ secrets.WIF_PROVIDER }}" ]; then
          echo "has_creds=true" >> $GITHUB_OUTPUT
        else
          echo "has_creds=false" >> $GITHUB_OUTPUT
          echo "GCP credentials not found. Skipping deployment steps."
        fi

    - name: Google Auth
      if: steps.check-creds.outputs.has_creds == 'true'
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      if: steps.check-creds.outputs.has_creds == 'true'
      uses: google-github-actions/setup-gcloud@v2

    - name: Get Project ID
      if: steps.check-creds.outputs.has_creds == 'true'
      id: project
      run: echo "id=$(gcloud config get-value project)" >> $GITHUB_OUTPUT

    - name: Configure Docker to push to Artifact Registry
      if: steps.check-creds.outputs.has_creds == 'true'
      run: gcloud auth configure-docker ${{ vars.GCR_HOSTNAME || 'us-central1-docker.pkg.dev' }}

    - name: Push Docker image
      if: steps.check-creds.outputs.has_creds == 'true'
      env:
        IMAGE_NAME: todo-app-go
        IMAGE_TAG: ${{ github.sha }}
        GCR_HOSTNAME: ${{ vars.GCR_HOSTNAME || 'us-central1-docker.pkg.dev' }}
        GAR_REPOSITORY: todo-app-go
        GCP_PROJECT: ${{ steps.project.outputs.id }}
      run: |
        docker tag todo-app-go:local $GCR_HOSTNAME/$GCP_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG
        docker push $GCR_HOSTNAME/$GCP_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG

    - name: Install Cosign
      if: steps.check-creds.outputs.has_creds == 'true'
      uses: sigstore/cosign-installer@v3.5.0

    - name: Sign image with a keyless signature
      if: steps.check-creds.outputs.has_creds == 'true'

      env:
        IMAGE_NAME: todo-app-go
        IMAGE_TAG: ${{ github.sha }}
        GCR_HOSTNAME: ${{ vars.GCR_HOSTNAME || 'us-central1-docker.pkg.dev' }}
        GAR_REPOSITORY: todo-app-go
        GCP_PROJECT: ${{ steps.project.outputs.id }}
      run: |
        IMAGE_PATH="$GCR_HOSTNAME/$GCP_PROJECT/$GAR_REPOSITORY/$IMAGE_NAME:$IMAGE_TAG"
        echo "Signing image: $IMAGE_PATH"
        cosign sign --yes "$IMAGE_PATH"

  security_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'  # keep in sync with the Dockerfile builder (golang:1.27-alpine)

      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -tests=false -exclude=G115,G706 ./...

      - name: Install and run Trivy vulnerability scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --exit-code 1 --ignore-unfixed --pkg-types os,library --severity CRITICAL,HIGH --ignorefile .trivyignore --format table .

