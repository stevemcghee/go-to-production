admissionWhitelistPatterns:
- namePattern: gcr.io/google_containers/*
- namePattern: gcr.io/google-containers/*
- namePattern: k8s.gcr.io/*
- namePattern: gke.gcr.io/*
- namePattern: quay.io/argoproj/*
- namePattern: docker.io/library/postgres:*
- namePattern: docker.io/curlimages/curl:*
- namePattern: gcr.io/cloud-sql-connectors/cloud-sql-proxy:*
- namePattern: us-central1-docker.pkg.dev/irtco-sandbox/todo-app-go/*
- namePattern: docker.io/openpolicyagent/*
- namePattern: index.docker.io/openpolicyagent/*
- namePattern: registry.hub.docker.com/openpolicyagent/*
- namePattern: openpolicyagent/gatekeeper:*
- namePattern: openpolicyagent/gatekeeper-crds:*
clusterAdmissionRules:
  us-central1.todo-app-cluster:
    enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG
    evaluationMode: REQUIRE_ATTESTATION
    requireAttestationsBy:
    - projects/irtco-sandbox/attestors/cosign-attestor
  us-east1.todo-app-cluster-secondary:
    enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG
    evaluationMode: REQUIRE_ATTESTATION
    requireAttestationsBy:
    - projects/irtco-sandbox/attestors/cosign-attestor
defaultAdmissionRule:
  enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG
  evaluationMode: REQUIRE_ATTESTATION
  requireAttestationsBy:
  - projects/irtco-sandbox/attestors/cosign-attestor
name: projects/irtco-sandbox/policy
